# 운영 Nginx: 80번 포트 하나로 화면(React 빌드 파일)과 API를 같이 제공한다.
# 개발 때 Vite 프록시가 하던 일을 운영에서는 Nginx가 한다 → 화면과 API가 같은 주소라 CORS 설정이 필요 없다.
# 바꾼 뒤에는 `nginx -t`로 문법 검사부터 한다 (문법만 잡는다 — 주소 오타 같은 내용 오류는 실제로 띄워 확인).
server {
    listen 80;          # 인터넷 기본 HTTP 포트. 이 서버에서 밖으로 열린 유일한 문
    server_name _;      # 어떤 도메인·IP로 들어와도 이 설정을 쓴다

    root /usr/share/nginx/html;  # React 빌드 결과(dist/)가 들어 있는 곳 (frontend/Dockerfile에서 복사)
    index index.html;

    client_max_body_size 2m;     # 요청 바디 최대 2MB (기본 1MB면 큰 웹훅이 Nginx에서 막힌다)

    # 백엔드로 전달할 때 붙이는 헤더 — 아래 모든 location에 공통 적용된다
    proxy_http_version 1.1;      # 백엔드와 HTTP/1.1로 (SSE처럼 길게 흐르는 응답에도 필요)
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 진짜 접속자 IP → 백엔드의 forward-headers-strategy가 읽는다
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE(REQ-LOG-001): /api/endpoints/{slug}/stream 만 골라서 버퍼링을 끈다.
    # Nginx는 원래 응답을 모았다가 보내는데, 그러면 새 요청 알림이 화면에 늦게 간다.
    # 주의: 이 주소에 오타가 있어도 Nginx는 잘 뜬다 — 그냥 아래 /api/ 규칙으로 가서 실시간만 조용히 깨진다.
    location ~ ^/api/endpoints/[^/]+/stream$ {
        proxy_pass http://backend:8080;   # backend = docker-compose 서비스 이름, 8080 = 그 컨테이너 안의 포트
        proxy_buffering off;              # 오는 즉시 화면으로
        proxy_cache off;
        proxy_read_timeout 1h;            # 조용한 연결을 끊지 않게 (기본 60초). 백엔드 하트비트(30초)와 이중 안전장치
    }

    # 관리 API와 웹훅 수신은 백엔드로
    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /h/ {
        proxy_pass http://backend:8080;
    }

    # 화면: 파일이 있으면 그 파일(js·css), 없으면 index.html.
    # /e/abc123 은 실제 파일이 아니라 React Router가 그리는 화면이라, 새로고침하면 원래 404가 난다 → index.html로 돌려준다(SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
